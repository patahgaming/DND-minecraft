name: DndPlugin
version: '${version}'
main: id.patahgaming.dndplugin.DndPlugin
api-version: '1.21'
author: patahgaming
description: DnD AI System - Minecraft-native interface dengan AI narator/NPC (DeepSeek)

commands:
  dnd:
    description: DnD admin commands (reload, save, version, stop, start)
    usage: /dnd <reload|save|version|stop|start>
  atk:
    description: Serangan saat giliran combat aktif
    usage: /atk <mob_id>
  roll:
    description: Roll dice untuk tindakan yang membutuhkan check
    usage: /roll <jenis_tindakan>
  talk:
    description: Mulai dialog dengan NPC (penting atau side)
    usage: /talk <npc_id> [pesan]
  spawnnpc:
    description: Spawn NPC penting dari template YAML
    usage: /spawnnpc <template_id>
  newnpc:
    description: Buat NPC penting baru (semua mob type) + simpan template YAML
    usage: /newnpc <npc_id> <display_name> [entity_type] [spawn]
  deletenpc:
    description: Hapus NPC (remove data + kill entity)
    usage: /deletenpc <npc_id>
  battle:
    description: Battle commands (start, duel, pvp, flee, status, forceend)
    usage: /battle <start|duel|pvp|flee|status|forceend>
  character:
    description: Character creation and info
    usage: /character <create|info> [class] [name] [race]
  cast:
    description: Cast spell saat combat
    usage: /cast <spell> [target]
  itemspesial:
    description: Item spesial management (create, get, list, info, give)
    usage: /itemspesial <create|get|list|info|give>
  poi:
    description: POI management (define, confirm, cancel, list, info, tree)
    usage: /poi <define|confirm|cancel|list|info|tree>
  dice:
    description: Roll dadu di tangan (fallback untuk Bedrock)
    usage: /dice
